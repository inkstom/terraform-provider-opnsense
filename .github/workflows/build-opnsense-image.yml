name: Build OPNsense Image

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/upgrade-opnsense.py'
  schedule:
    - cron: '0 4 */7 * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  delete-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale OPNsense image caches
        run: |
          # Delete by ID: the same key can exist on several refs, and deleting by
          # key removes them all, so a later delete of that key would fail.
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 1000 --json id,key,ref \
            --jq '.[] | select(.key | startswith("opnsense-image-")) | "\(.id) \(.ref) \(.key)"' | \
            while read -r id ref key; do
              echo "Deleting cache $id ($ref): $key"
              gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
            done
        env:
          GH_TOKEN: ${{ github.token }}

  opnsense-image:
    needs: delete-cache
    strategy:
      matrix:
        include:
          - version: '26.1'
            sha1: '2266a644b1669be1a8d916a0a79fc91ba4be4733'
          - version: '26.7'
            sha1: '85adfabb6b1e23beec8673e4bbe83e869666f954'
    uses: ./.github/workflows/build-opnsense-image-reusable.yml
    with:
      opnsense-version: ${{ matrix.version }}
      opnsense-sha1: ${{ matrix.sha1 }}
      artifact-name: opnsense-image-${{ matrix.version }}

