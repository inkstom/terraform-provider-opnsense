name: Post-merge Tests (Tier 2)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'scripts/**'
      - 'templates/**'
      - 'README.md'
      - '.github/**'

permissions:
  contents: read

# A newer push to main supersedes this run: only the latest commit needs the
# full suite. Keeps Actions usage down (GitHub throttles heavy use on forks).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/terraform-test-reusable.yml
    with:
      packages: './...'
