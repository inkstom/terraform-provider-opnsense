name: PR Tests (Tier 1)

on:
  # No path filter: main's branch protection requires "PR tests passed", so this
  # workflow must report on every PR. detect-changes skips the tests when no Go
  # code changed.
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A newer push to the same PR supersedes this run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Fetch main branch
        # No --depth: a shallow fetch of main hides the merge base once main
        # has moved past the PR's base, and `git diff origin/main...HEAD` fails.
        run: git fetch origin main
      - name: Detect changed packages
        id: detect
        run: |
          ALL_CHANGED=$(git diff --name-only origin/main...HEAD)

          # Check for any Go source or module file changes
          GO_FILES=$(echo "$ALL_CHANGED" | grep '\.go$' || true)
          MOD_CHANGED=$(echo "$ALL_CHANGED" | grep -E '^go\.(mod|sum)$' || true)

          # Changes to the test harness itself (VM image, upgrade script, test
          # workflows) can break every test, so they run the full suite.
          HARNESS_CHANGED=$(echo "$ALL_CHANGED" | grep -E '^(scripts/upgrade-opnsense\.py|\.github/workflows/(terraform-test-(pr|reusable)|build-opnsense-image-reusable)\.yml)$' || true)

          if [ -n "$HARNESS_CHANGED" ]; then
            echo "Test harness changed — running full suite"
            echo "packages=./..." >> "$GITHUB_OUTPUT"
          elif [ -z "$GO_FILES" ] && [ -z "$MOD_CHANGED" ]; then
            echo "No Go files changed — skipping tests"
            echo "packages=" >> "$GITHUB_OUTPUT"
          elif [ -n "$MOD_CHANGED" ]; then
            echo "go.mod/go.sum changed — running full suite"
            echo "packages=./..." >> "$GITHUB_OUTPUT"
          else
            CORE_CHANGED=$(echo "$GO_FILES" | grep -E '^(main\.go|internal/tools/|internal/acctest/|internal/provider/|internal/validators/)' || true)
            if [ -n "$CORE_CHANGED" ]; then
              echo "Core files changed — running full suite"
              echo "packages=./..." >> "$GITHUB_OUTPUT"
            else
              SERVICE_PKGS=$(echo "$GO_FILES" | grep '^internal/service/' | sed 's|^\(internal/service/[^/]*\)/.*|\1|' | sort -u | sed 's|^|./|; s|$|/...|' | tr '\n' ' ' | sed 's/ $//')
              if [ -z "$SERVICE_PKGS" ]; then
                echo "No relevant packages detected — running full suite"
                echo "packages=./..." >> "$GITHUB_OUTPUT"
              else
                echo "Changed service packages: ${SERVICE_PKGS}"
                echo "packages=${SERVICE_PKGS}" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

  test:
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != ''
    uses: ./.github/workflows/terraform-test-reusable.yml
    with:
      packages: ${{ needs.detect-changes.outputs.packages }}

  # The single required check. Passes when the tests passed or were skipped
  # because nothing testable changed; fails if any needed job failed or was
  # cancelled.
  result:
    name: PR tests passed
    needs: [detect-changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          DETECT: ${{ needs.detect-changes.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "detect-changes: $DETECT, test: $TEST"
          [ "$DETECT" = success ] || exit 1
          case "$TEST" in success|skipped) ;; *) exit 1 ;; esac
